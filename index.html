<script>
const stories=[
{id:'intro',cat:'Storyline',label:'An introduction',q:'Tell us about yourself.',x:16,y:15,m:1,body:["Good morning, and thank you for having me.","I'm currently a Senior Digital Solutions Programmer at AECOM Singapore, but I think the most useful way to introduce myself is through what I've been building.","Over the past three years, I've developed software solutions for several engineering disciplines, from geotechnical engineering to cost management.","But this year, my approach to software development has changed fundamentally with agentic AI.","One project I'm particularly proud of is Caros, an enterprise AI agent that I independently initiated and developed.","I started with an existing open-source agent framework and adapted it to our enterprise environment, integrating Microsoft Entra ID authentication, centralized Azure OpenAI access, model usage controls and safeguards around agent execution.","Within roughly four months, we moved from the initial idea to an application that colleagues were actually using. Our October operational review recorded 27 users making API calls over a 30-day period.","And what I find most interesting is how I delivered it.","I used AI coding agents extensively throughout development. My own development-tool subscriptions cost only a few hundred dollars, although that doesn't include the underlying cloud services or my engineering time.","I was responsible for deciding what to build, choosing the architecture, defining the constraints and validating the delivered behavior.","That experience changed how I think about software engineering. I believe small, capable teams can now deliver much more than was previously practical.","What attracts me to the AI Engineering team in Zug is the opportunity to combine that approach with AECOM's global platform capabilities.","I believe I can contribute not just technical implementation, but a proven approach to turning AI capabilities into useful products for engineering teams."]},
{id:'caros',cat:'Storyline',label:'Caros',q:'How did you turn Caros into something people use?',x:42,y:10,m:2,body:["After our office-wide coding hackathon, I saw an opportunity to make AI agents usable in everyday engineering work. That required more than a model: colleagues needed company sign-in, controlled model access and a usable Windows experience.","I chose Goose as the foundation and directed the development of Caros around it: a Rust agent backend, an Electron desktop app and a CLI, with Entra ID and central Azure OpenAI access through API Management and a gateway. That let me concentrate effort on the enterprise requirements and the user experience.","I got it into use within a few months, spending a few hundred on Claude Code and ChatGPT subscriptions to support development. The 30-day review ending 20 October recorded 27 users making calls. That was the meaningful transition: from an interesting demo to a tool colleagues were actually using.","My ownership continued after delivery—usage controls, prompt-cache behavior, worker status and recovery when a working folder disappeared. Adoption gave me a real feedback loop for deciding what to improve next."]},
{id:'map',cat:'Storyline',label:'The map that lied',q:'How do you know the agents got it right?',x:77,y:24,m:3,body:["I check whether the application tells the truth to the user. During live testing of the Caros agent map, an existing chat showed ten workers still running. Their saved results showed they had already finished.","I caught the discrepancy in the actual application. The investigation traced it to the ACP transport dropping the result metadata carrying worker status. The UI was displaying a convincing picture of the wrong state.","The fix passed that metadata through to the desktop while preserving the priority of trusted platform fields. We checked the transport and adapter, then replayed the session: all ten workers appeared as completed. A worker stopped by its turn limit correctly appeared as failed, with a reason. The feature shipped in v0.5.3.","That is where my judgment matters. Agents supported diagnosis and implementation; I checked the behavior against what the user needed to know. The acceptance test was a truthful restored session, including failure—not just a green new-session path."]},
{id:'folder',cat:'Storyline',label:'A way back in',q:'Tell us about a difficult recovery problem.',x:73,y:72,m:4,body:["A saved Caros chat would not load if its working folder had been deleted. The application was treating reading history and executing work as if they had the same requirement.","My product decision was simple: keep the history readable and preserve the draft, but require a valid folder before running anything. That gave the user a way back without weakening the execution checks.","The implementation separated loading from execution validation. It covered typed messages, queued messages, Resume and Send Now. Review also exposed races while the folder check was awaiting a result: the draft or chat could change in the meantime. The fix re-read current state before sending and prevented competing sends.","The record includes 18 desktop working-folder tests, two server tests and a live recovery check. History loaded, the draft survived, sending stayed blocked, and selecting a valid folder restored it. It shipped in v0.5.6. The important decision was defining a recoverable experience, then following it through every entry point."]},
{id:'cost',cat:'Storyline',label:'Cost Intelligence',q:'How does your engineering background shape software?',x:43,y:89,m:5,body:["Cost Intelligence turns Excel project records into a shared cost library. Users upload files, review extracted items, correct classifications and use the data for project search, comparison and permitted exports.","I drafted the initial database schema, set the access-control principles and established design guidelines. I also contributed service health checks. The system combines React, Python and FastAPI with a relational database, and uses Azure OpenAI alongside parsing and classification rules.","The interesting engineering is in what the data means. A schedule header and its detail rows describe the same money at different levels. Counting both would inflate the total. The system uses detail rows when present, falls back to the header otherwise, and checks subtotals against the contract sum.","AI suggestions and user corrections are kept separately. The workflow gives cost professionals a way to review the output, while the backend applies permissions and amount checks. That is the contribution I bring: turning domain knowledge into explicit product and system rules."]},
{id:'close',cat:'Storyline',label:'What I bring',q:'Is there anything you would like to leave us with?',x:17,y:69,m:6,body:["What I would bring to Zug is the ability to connect an engineering need to a product people can use—and to take responsibility for the decisions in between. Caros and Cost Intelligence give us concrete examples to discuss: architecture, access, adoption, recovery and the details that make a workflow trustworthy.","I see agents becoming a normal part of engineering delivery. As implementation gets faster, taste is what matters now: deciding what deserves to exist, seeing where a plausible solution falls short, and insisting on a result that works for people.","That is the kind of engineering I want to do with this team. I would be interested to hear which problem you most need someone to own, and how you would judge a successful first six months."]},
{id:'ownership',cat:'Judgment',label:'What I own',q:'What did you personally contribute?',x:8,y:37,body:["I own problem definition, direction and acceptance. I decide which user problem to solve, choose the foundation, establish constraints and review the proposed plan. I use agents extensively for implementation and investigation, and I test the result against the behavior I intended.","For Caros, that meant Goose, central model access, a Windows focus, desktop and CLI interfaces, and product decisions such as keeping history available when a folder disappears. For Cost Intelligence, it includes the initial schema, access principles, design guidelines and service health checks.","You can evaluate my contribution through those decisions and the resulting behavior. I’m comfortable going into a specific example."]},
{id:'taste',cat:'Judgment',label:'What taste means',q:'What do you mean by taste in engineering?',x:28,y:30,body:["Taste is judgment made concrete. It is recognizing which problem matters, choosing an approach that fits, and noticing when a technically plausible result is wrong for the user.","In Caros, a missing folder should not erase access to a conversation. A worker map should reflect the actual worker state. In Cost Intelligence, totals should respect the structure of the cost data. Those are product and engineering judgments before they are implementation tasks.","Agents make it cheaper to produce alternatives. Taste helps me choose between them and set a standard for the result. I make that judgment testable through acceptance criteria and real application checks."]},
{id:'process',cat:'Judgment',label:'From intent to release',q:'How do you work with coding agents?',x:56,y:24,body:["I start with the business need and the behavior I want. I ask the agent for a plan, read it, challenge assumptions and resolve unclear requirements before implementation.","Project guidance gives the work a consistent reference for design and validation. Review agents and automated checks help find problems, and I open the application to exercise the actual workflow. The agent-map bug is a useful example of why that last step matters.","I keep the loop anchored in a concrete question: does this change do what the user needs, including when something goes wrong? That keeps speed connected to quality."]},
{id:'team',cat:'Judgment',label:'Working with a team',q:'How will you contribute in a dedicated software team?',x:26,y:52,body:["I bring product ownership and direct knowledge of engineering workflows. My implementation work has often been independent, but defining requirements, validating the solution and obtaining sign-off involves close work with stakeholders across disciplines.","I’ve also contributed issues and pull requests to Goose, which puts my work into an existing codebase and review process. In Zug, I want to combine that delivery experience with shared design, review and operational ownership.","I’m comfortable having a decision challenged. A good discussion should make the product better and leave the reasoning clearer to the next person maintaining it."]},
{id:'review',cat:'Judgment',label:'Changing my mind',q:'Tell us about a technical review that changed your approach.',x:10,y:91,body:["A slash-command defect in Caros caused duplicate prompts. The initial approach suppressed duplicates in the desktop path. Upstream review favored fixing the ACP server so the behavior would be correct for every client.","The revised approach tracked prompt identity rather than comparing text, because sanitization could change the text. That moved the fix to the layer that owned the behavior and made it less dependent on a particular client.","The record includes the review and a passing end-to-end test. The useful lesson for me was to ask where an invariant belongs before patching the place where its failure becomes visible."]},
{id:'scale',cat:'Technical depth',label:'Scaling the gateway',q:'How would you scale Caros to hundreds of users?',x:91,y:8,body:["I would start with concurrent token demand, latency and rejection rates. In the October review, 27 users made calls, but only four were active in the busiest minute. An agent can also launch parallel workers, so headcount alone is a weak capacity measure.","The gateway snapshot had one replica with in-memory allowance and routing state. My next design would move shared limits into a store such as Redis and make admission an atomic reserve-then-settle operation. Each request would reserve estimated tokens, then reconcile against actual usage. Per-user concurrency limits would protect fairness.","I would test quota-store failures, replica loss, timeouts and bounded retries. Additional gateway replicas and additional model quota solve different constraints, so I would plan them separately."]},
{id:'quota',cat:'Technical depth',label:'Fairness under load',q:'How do you stop two replicas spending the same allowance?',x:94,y:38,body:["The allowance check and reservation must be one atomic operation in a shared store. Separate local counters let both replicas admit work against the same remaining balance.","I would give each reservation an identity, reconcile it once with actual usage, and define expiry and recovery for requests whose replica disappears. Minute capacity and weekly allowances need their own accounting rules.","I would also limit concurrent work per user. Fairness needs to account for one agent session starting several workers, not just the number of signed-in users."]},
{id:'failure',cat:'Technical depth',label:'When the model says 429',q:'How would you handle rate limits and service failure?',x:84,y:54,body:["First I would identify which limit was hit: a user allowance, gateway admission or provider capacity. That determines whether retrying can help.","For a transient provider limit, I would respect Retry-After, use bounded backoff and keep an overall deadline. I would test the client and gateway together because a correct capacity counter does not help if the client gives up before capacity becomes available.","If a shared quota store were unavailable, I would reject new admissions or use a deliberately bounded fallback. Allowing every replica to spend a full local allowance would defeat the control."]},
{id:'cache',cat:'Technical depth',label:'A stable prompt prefix',q:'Give an example of an efficiency problem you investigated.',x:61,y:5,body:["An investigation into poor prompt-cache reuse in Caros found changing timestamps and task context inside the client message. Those changes disturbed the reusable prefix.","The fix preserved earlier context and appended changing information at the end. It is a small-looking design choice with a direct connection to how the model service reuses input.","My takeaway is to examine the exact request being sent. A high-level architecture diagram can look right while small changes in message construction undermine its efficiency."]},
{id:'access',cat:'Technical depth',label:'Permission is a behavior',q:'How do you design access control?',x:60,y:69,body:["I separate identity from permission. In Cost Intelligence, a valid Entra token must also satisfy the application’s role or configured-group requirement. The backend then checks whether that caller can perform the requested action.","Users can edit their own uploads, while administrators have wider rights. Confidential project fields follow their own ownership and version rules. Viewing a field does not automatically grant permission to edit the underlying upload.","I put these checks in the backend because hiding a button cannot stop a direct API request. I would discuss an actual route and its allowed and denied cases to make that boundary concrete."]},
{id:'money',cat:'Technical depth',label:'Making totals mean something',q:'How do you protect the accuracy of cost totals?',x:59,y:96,body:["The rules start with the meaning of the rows. Detail rows contribute when they exist; the schedule header is used when they do not. We must never count both as separate money.","The backend validates proposed amounts before saving preview changes and repeats the amount checks when recalculating stored data. It checks detail totals against schedule headers and schedule totals against the project contract sum. User classifications take priority when present.","The database uses DECIMAL and important checks use Python Decimal. I would also trace rounding through extraction and API boundaries, where some paths still use floating-point values. That is the next place I would tighten precision."]},
{id:'jobs',cat:'Technical depth',label:'Beyond background tasks',q:'What would you improve before wider CIS rollout?',x:90,y:90,body:["I would prioritize durable processing and shared progress. The current FastAPI processing task runs inside the application process, so a restart can interrupt work. A durable queue, recoverable job state and explicit retry rules would give us a stronger foundation.","Then I would check concurrent uploads and edits, and the boundary between saving preview changes and recalculating totals. I would test what happens if one succeeds and the other fails.","I would use processing time, failure rates and cost-expert correction rates to decide what to improve next. That connects engineering effort to the reliability and usefulness of the workflow."]},
{id:'aiquality',cat:'Technical depth',label:'Evaluating AI output',q:'How do you check AI classification quality?',x:41,y:67,body:["Cost Intelligence combines parsing, classification rules and model calls. Users review suggestions and can correct them; original suggestions and corrections are stored separately.","I would evaluate classifications against cost-expert labels and track correction rates. I would also look separately at errors affecting high-value items, because a small number of them may matter more than many minor mistakes.","Amount checks provide a separate signal: a classification can look plausible while the resulting cost picture is wrong. I want both domain review and deterministic checks around the model output."]},
{id:'zug',cat:'Zug',label:'Why this team',q:'Why Zug, and why now?',x:40,y:36,body:["I’ve shown that I can take an engineering need and turn it into a working product within AECOM. I now want to bring that experience into a dedicated AI engineering team and work on capabilities that can serve more offices.","Zug interests me because of the opportunity to combine domain context with shared software engineering and a broader product mandate. I bring examples from geotechnical engineering, cost management and protective security that can inform those discussions.","The next step I want is shared ownership of a meaningful product: deciding what to build, delivering it and learning from its use at a wider scale."]},
{id:'first',cat:'Zug',label:'The first 90 days',q:'What would your first three months look like?',x:70,y:44,body:["I would first understand the team’s priorities, architecture, users and release process. Then I would agree on one useful, bounded problem and take it through the team’s normal design, review and delivery process.","Alongside that, I would map the engineering workflows I know to the team’s roadmap and validate one promising connection with users outside Singapore.","By the end of that period, I would want an agreed contribution delivered, productive working relationships, and a clear view of the next problem I could own."]},
{id:'askimpact',cat:'Questions',label:'What impact matters?',q:'Where can I make the strongest contribution?',x:8,y:4,body:["Which engineering workflow is the team most determined to improve over the next six to twelve months—and what is currently stopping you from making that improvement?","How do you measure whether an AI product has become useful in daily work: repeat use, completed tasks, quality, or time saved?","I’d like to understand where someone who can connect engineering users with agent-based delivery would make the greatest difference."]},
{id:'askagents',cat:'Questions',label:'How do you build now?',q:'What does agent-native engineering look like here?',x:28,y:94,body:["How are coding agents changing the team’s development process today—from design through implementation, review and release?","Where do you want engineers to exercise the most judgment as implementation gets faster?","How much room would I have to improve that workflow and demonstrate a better approach through a bounded, measurable delivery?"]},
{id:'askmodels',cat:'Questions',label:'The model decision',q:'How do you choose and evolve the model stack?',x:92,y:71,body:["How do you evaluate newer models and decide when to put them into production? What evidence makes a change worthwhile?","Which constraints are most significant today: evaluation coverage, security approval, cost, capacity or integration work?","Who owns that decision, and how can a product engineer help move it forward?"]},
{id:'askmandate',cat:'Questions',label:'The mandate',q:'What would I be trusted to own?',x:66,y:87,body:["What would you expect me to own by the end of my first six months?","How are product decisions shared between the engineering team, domain experts and the wider business?","And what would make you look back after six months and say that bringing me into the team was the right decision?"]}
];
const $=id=>document.getElementById(id),universe=$('universe'),card=$('card');let active=null,pinned=false,filter='All stars',closeTimer=null,journeyMode=false;
const categories=['All stars','Storyline','Judgment','Technical depth','Zug','Questions'];
for(const cat of categories){const b=document.createElement('button');b.textContent=cat;b.setAttribute('aria-pressed',cat===filter);b.onclick=()=>{filter=cat;journeyMode=false;applyFilters();};$('filters').append(b);}
stories.forEach((s,i)=>{const n=document.createElement('button');n.className='node'+(s.m?' major':'');n.style.left=s.x+'%';n.style.top=s.y+'%';n.dataset.id=s.id;n.setAttribute('aria-label',s.q);n.setAttribute('aria-expanded','false');n.innerHTML='<span class="orb" aria-hidden="true"></span><span class="label"></span>'+(s.m?'<span class="number">0'+s.m+'</span>':'');n.querySelector('.label').textContent=s.label;n.onpointerenter=e=>{if(e.pointerType==='mouse'&&!pinned){clearTimeout(closeTimer);openStory(s,false);}};n.onpointerleave=()=>scheduleClose();n.onclick=()=>{journeyMode=false;openStory(s,true);};n.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();moveNode(i,1);}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();moveNode(i,-1);}};universe.append(n);s.node=n;});
function arrangeStars(){const mobile=innerWidth<=800;stories.forEach((s,i)=>{s.node.style.left=(mobile?[16,50,84][i%3]:s.x)+'%';s.node.style.top=(mobile?14+Math.floor(i/3)*9.3+(i%3===1?2:0):s.y)+'%';});}arrangeStars();
function moveNode(i,dir){for(let k=1;k<=stories.length;k++){const s=stories[(i+k*dir+stories.length*2)%stories.length];if(!s.node.hidden){s.node.focus();break;}}}
function visible(){return stories.filter(s=>!s.node.hidden)}
function applyFilters(){closeStory();const query=$('search').value.trim().toLowerCase();stories.forEach(s=>{s.node.hidden=!((filter==='All stars'||filter===s.cat)&&[s.q,s.label,...s.body].join(' ').toLowerCase().includes(query));});document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.textContent===filter));let count=visible().length;$('empty').style.display=count?'none':'block';$('centerMark').style.opacity=count?'.92':'0';document.querySelector('.orbits').style.opacity=filter==='All stars'&&!query?'.4':'.12';}
function placeCard(s){const r=s.node.getBoundingClientRect();const w=Math.min(440,innerWidth-32);card.style.width=w+'px';const h=Math.min(card.scrollHeight,innerHeight-(innerWidth<=800?28:80));const left=Math.max(16,Math.min(innerWidth-w-16,r.left+r.width/2-w/2));const top=Math.max(14,Math.min(innerHeight-h-14,r.top+r.height/2-h*.4));card.style.left=left+'px';card.style.top=top+'px';card.style.setProperty('--origin',Math.max(0,Math.min(w,r.left+r.width/2-left))+'px '+Math.max(0,Math.min(h,r.top+r.height/2-top))+'px');}
function openStory(s,keep){clearTimeout(closeTimer);if(active&&active!==s){active.node.classList.remove('active');active.node.setAttribute('aria-expanded','false');}active=s;pinned=keep;s.node.classList.add('active');s.node.setAttribute('aria-expanded','true');$('category').textContent=s.cat+(s.m?' / 0'+s.m:'');$('question').textContent=s.q;$('answer').replaceChildren(...s.body.map(t=>{const p=document.createElement('p');p.textContent=t;return p;}));card.scrollTop=0;$('pin').setAttribute('aria-pressed',pinned);$('pin').textContent=pinned?'Kept open · release':'Keep open ↗';card.setAttribute('aria-hidden','false');card.inert=false;placeCard(s);card.classList.add('open');universe.classList.add('has-open');}
function closeStory(returnFocus=false){clearTimeout(closeTimer);const last=active;if(active){active.node.classList.remove('active');active.node.setAttribute('aria-expanded','false');}active=null;pinned=false;card.classList.remove('open');card.setAttribute('aria-hidden','true');card.inert=true;universe.classList.remove('has-open');if(returnFocus&&last)last.node.focus();}
function scheduleClose(){clearTimeout(closeTimer);if(!pinned)closeTimer=setTimeout(()=>{if(!card.matches(':hover'))closeStory();},170);}
card.addEventListener('click',e=>{if(!e.target.closest('button')){pinned=true;$('pin').setAttribute('aria-pressed','true');$('pin').textContent='Kept open · release';}});card.onpointerenter=()=>clearTimeout(closeTimer);card.onpointerleave=()=>scheduleClose();$('close').onclick=()=>closeStory(true);$('pin').onclick=()=>{pinned=!pinned;$('pin').setAttribute('aria-pressed',pinned);$('pin').textContent=pinned?'Kept open · release':'Keep open ↗';};
function step(dir){const seq=journeyMode?stories.filter(s=>s.m):visible();const idx=seq.indexOf(active);openStory(seq[(idx+dir+seq.length)%seq.length],true);}
$('next').onclick=()=>step(1);$('previous').onclick=()=>step(-1);$('journey').onclick=()=>{filter='All stars';$('search').value='';applyFilters();journeyMode=true;openStory(stories[0],true);$('close').focus();};$('search').oninput=()=>{journeyMode=false;applyFilters();};$('reset').onclick=()=>{filter='All stars';$('search').value='';applyFilters();};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStory(true);});document.addEventListener('pointerdown',e=>{if(active&&!card.contains(e.target)&&!e.target.closest('.node')&&!e.target.closest('#journey'))closeStory();});window.addEventListener('resize',()=>{arrangeStars();if(active)placeCard(active);drawCosmos();});window.addEventListener('scroll',()=>{if(active&&!pinned)closeStory();},{passive:true});card.inert=true;applyFilters();
// A deterministic, locally drawn galaxy: no external assets or network requests.
function drawCosmos(){const canvas=$('cosmos'),ctx=canvas.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#070910';ctx.fillRect(0,0,w,h);let seed=73;const rand=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const clouds=[[.46,.49,.42,'92,65,129',.13],[.6,.46,.3,'48,83,134',.12],[.32,.57,.27,'145,93,109',.10],[.66,.31,.22,'101,91,154',.09]];for(const [x,y,size,c,a]of clouds){const g=ctx.createRadialGradient(x*w,y*h,0,x*w,y*h,w*size);g.addColorStop(0,'rgba('+c+','+a+')');g.addColorStop(1,'rgba('+c+',0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}
for(let i=0;i<800;i++){const x=rand()*w,y=rand()*h,r=rand()<.965?rand()*.75+.15:rand()*1+.6;ctx.globalAlpha=.18+rand()*.6;ctx.fillStyle=rand()>.75?'#c4a5d8':'#e1e5f3';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
ctx.save();ctx.translate(w*.51,h*.53);ctx.rotate(-.31);for(let i=0;i<6200;i++){const t=rand()*Math.PI*5,arm=i%3,rad=25+Math.pow(rand(),.65)*w*.45;const angle=t*.08+rad/(w*.115)+arm*Math.PI*2/3;const spread=(rand()-.5)*(.17+rad*.16);const x=Math.cos(angle)*rad+spread,y=Math.sin(angle)*rad*.32+spread*.55;ctx.globalAlpha=(1-rad/(w*.55))*(.035+rand()*.14);ctx.fillStyle=arm===1?'#e2b5b4':arm===2?'#9eaed6':'#c4addb';ctx.beginPath();ctx.arc(x,y,rand()*1.2+.2,0,Math.PI*2);ctx.fill();}ctx.restore();ctx.globalAlpha=1;}
drawCosmos();
